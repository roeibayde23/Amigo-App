<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amigo — העוזר האישי שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6ECDD; --bg-deep:#EFE0C8; --paper:#FFFCF6;
    --burgundy:#6B1029; --burgundy-dark:#430A1B; --burgundy-soft:rgba(107,16,41,0.08);
    --gold:#B8874A; --ink:#2C1015; --ink-soft:#6E5750; --on-burgundy:#F6ECDD;
    --shadow:0 12px 28px rgba(67,10,27,0.14);
  }
  body.dark{
    --bg:#221014; --bg-deep:#2E141B; --paper:#2C1418;
    --burgundy:#C6486A; --burgundy-dark:#8A2E45; --burgundy-soft:rgba(198,72,106,0.16);
    --gold:#DDAE72; --ink:#F3E7DE; --ink-soft:#BFA299; --on-burgundy:#221014;
    --shadow:0 12px 28px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--bg); color:var(--ink); font-family:'Rubik',sans-serif; -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ min-height:100vh; display:flex; justify-content:center; background:radial-gradient(ellipse at 50% -10%, var(--bg-deep) 0%, var(--bg) 55%); transition:background .25s ease,color .25s ease; }
  .app{ width:100%; max-width:460px; min-height:100vh; position:relative; padding-bottom:40px; }
  .inner{ padding:0 18px; }

  .topbar{
    background:linear-gradient(120deg, var(--burgundy), var(--burgundy-dark));
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    border-radius:0 0 22px 22px; box-shadow:0 6px 18px rgba(67,10,27,0.25); margin-bottom:14px;
  }
  .brand-name{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:24px; color:var(--on-burgundy); letter-spacing:.4px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .brand-date{ font-size:11.5px; color:var(--on-burgundy); opacity:.75; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; color:var(--on-burgundy); cursor:pointer; flex-shrink:0; }
  .icon-btn svg{ width:17px; height:17px; }
  .sq-btn{ width:36px; height:36px; border-radius:12px; border:none; background:var(--burgundy); color:var(--on-burgundy); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 3px 8px rgba(67,10,27,.3); }
  .sq-btn svg{ width:17px; height:17px; }
  .round-btn{ width:30px; height:30px; border-radius:50%; border:1px solid var(--bg-deep); background:var(--paper); color:var(--burgundy); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .round-btn svg{ width:15px; height:15px; }

  .view{ display:none; }
  .view.active{ display:block; animation:fadeSlide .2s ease; }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---- dashboard ---- */
  .greeting{ text-align:center; margin:4px 0 8px; }
  .greeting h1{ font-family:'Frank Ruhl Libre',serif; font-weight:500; font-size:21px; line-height:1.35; }
  .greeting span.name{ color:var(--burgundy); font-weight:700; }
  .greeting p{ margin-top:4px; font-size:13px; color:var(--ink-soft); }

  .hero{ display:flex; justify-content:center; margin:8px 0 16px; }
  .dog-wrap{ width:200px; border:none; background:none; padding:0; cursor:pointer; transition:transform .15s ease; }
  .dog-wrap:active{ transform:scale(.96); }
  .dog-wrap img{ width:100%; display:block; filter:drop-shadow(0 14px 18px rgba(67,10,27,.28)); }

  .menu{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
  .menu-btn{ background:var(--paper); border:1px solid var(--bg-deep); border-radius:18px; padding:16px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; box-shadow:0 4px 12px rgba(67,10,27,.06); position:relative; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .menu-btn.active{ border-color:var(--burgundy); box-shadow:0 4px 14px rgba(67,10,27,.18); }
  .menu-btn:active{ transform:translateY(2px); }
  .menu-icon{ width:42px; height:42px; border-radius:50%; background:var(--burgundy-soft); display:flex; align-items:center; justify-content:center; }
  .menu-icon svg{ width:20px; height:20px; stroke:var(--burgundy); }
  .menu-btn span{ font-size:13px; font-weight:500; color:var(--ink); }
  .badge{ position:absolute; top:8px; left:8px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--gold); color:var(--paper); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; }

  .panel-wrap{ display:none; margin-bottom:14px; animation:fadeSlide .2s ease; }
  .panel-wrap.open{ display:block; }
  .panel-card{ background:var(--paper); border:1px solid var(--bg-deep); border-radius:18px; padding:14px; box-shadow:0 4px 12px rgba(67,10,27,.06); }
  .add-row{ display:flex; gap:7px; margin-bottom:10px; }
  .add-row input{ flex:1; border:1px solid var(--bg-deep); background:var(--bg); border-radius:12px; padding:9px 11px; font-family:'Rubik',sans-serif; font-size:13px; color:var(--ink); outline:none; }
  .add-row input:focus{ border-color:var(--gold); }
  .add-row button{ width:38px; border:none; border-radius:12px; background:var(--burgundy); color:var(--on-burgundy); font-size:18px; cursor:pointer; flex-shrink:0; }
  .task-item{ display:flex; align-items:center; gap:9px; padding:10px 2px; border-top:1px solid var(--bg-deep); }
  .task-item:first-child{ border-top:none; }
  .task-check{ width:21px; height:21px; border-radius:50%; border:2px solid var(--gold); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; background:transparent; }
  .task-check svg{ width:11px; height:11px; opacity:0; }
  .task-item.done .task-check{ background:var(--gold); }
  .task-item.done .task-check svg{ opacity:1; stroke:var(--paper); }
  .task-text{ flex:1; font-size:13px; }
  .task-item.done .task-text{ color:var(--ink-soft); text-decoration:line-through; }
  .task-recurring{ font-size:10px; color:var(--burgundy); background:var(--burgundy-soft); padding:2px 7px; border-radius:8px; flex-shrink:0; }
  .task-del{ width:26px; height:26px; border:none; background:none; cursor:pointer; color:var(--ink-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .task-del svg{ width:15px; height:15px; }
  .empty-note{ text-align:center; font-size:12px; color:var(--ink-soft); padding:16px 6px; }

  /* suggestion card */
  .suggest-card{ display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--bg-deep); border-radius:18px; padding:14px; cursor:pointer; box-shadow:0 4px 12px rgba(67,10,27,.06); margin-bottom:8px; }
  .suggest-icon{ width:44px; height:44px; border-radius:50%; background:var(--burgundy); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .suggest-icon svg{ width:20px; height:20px; stroke:var(--on-burgundy); }
  .suggest-body{ flex:1; min-width:0; }
  .suggest-label{ font-size:11px; color:var(--gold); font-weight:600; margin-bottom:2px; }
  .suggest-title{ font-size:13.5px; font-weight:500; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .suggest-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }

  /* ---- calendar / mail sub-header ---- */
  .subhead-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .subhead-date{ font-size:12px; color:var(--ink-soft); }
  .daynav{ display:flex; align-items:center; gap:10px; }
  .daynav-pill{ background:var(--paper); border:1px solid var(--bg-deep); border-radius:14px; padding:7px 16px; font-size:13px; font-weight:500; }
  .daynav-arrow{ width:28px; height:28px; border:none; background:none; color:var(--burgundy); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .daynav-arrow svg{ width:16px; height:16px; }

  .daylabel-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .daylabel{ font-size:15px; font-weight:600; }
  .daycount{ font-size:12px; color:var(--ink-soft); }
  .demo-pill{ font-size:10.5px; background:var(--burgundy-soft); color:var(--burgundy); padding:3px 9px; border-radius:9px; margin-inline-start:auto; }

  /* timeline */
  .timeline{ position:relative; padding-inline-end:14px; }
  .timeline-item{ display:flex; align-items:stretch; gap:10px; margin-bottom:10px; }
  .tl-card{ flex:1; background:var(--paper); border-inline-start:4px solid var(--gold); border-radius:14px; padding:11px 13px; display:flex; align-items:center; gap:8px; box-shadow:0 3px 10px rgba(67,10,27,.05); }
  .tl-edit{ border:none; background:none; color:var(--ink-soft); cursor:pointer; flex-shrink:0; display:flex; }
  .tl-edit svg{ width:15px; height:15px; }
  .tl-body{ flex:1; min-width:0; }
  .tl-title{ font-size:13.5px; font-weight:600; }
  .tl-time{ font-size:11.5px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; }
  .tl-check{ color:var(--gold); flex-shrink:0; }
  .tl-check svg{ width:15px; height:15px; }
  .tl-dot-col{ display:flex; flex-direction:column; align-items:center; width:10px; flex-shrink:0; }
  .tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--bg-deep); margin-top:16px; }
  .tl-line{ width:2px; flex:1; background:var(--bg-deep); }

  .fab{ position:sticky; bottom:16px; margin:16px auto 0; display:flex; justify-content:center; }
  .fab button{ background:var(--burgundy); color:var(--on-burgundy); border:none; border-radius:16px; padding:12px 22px; font-family:'Rubik',sans-serif; font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; cursor:pointer; box-shadow:0 8px 20px rgba(67,10,27,.3); }
  .fab svg{ width:16px; height:16px; }

  /* ---- mail page ---- */
  .mailhead-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .mailhead-icon{ font-size:16px; }
  .mailhead-title{ font-family:'Frank Ruhl Libre',serif; font-size:18px; }
  .mail-card{ background:var(--paper); border:1px solid var(--bg-deep); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:0 4px 12px rgba(67,10,27,.05); transition:border-color .15s ease; }
  .mail-card.important{ border-inline-start:4px solid var(--gold); }
  .mail-row1{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .mail-tag{ font-size:10.5px; background:var(--burgundy-soft); color:var(--burgundy); padding:3px 9px; border-radius:9px; }
  .mail-from{ font-size:12.5px; font-weight:600; color:var(--burgundy); }
  .mail-subject{ font-size:14px; font-weight:600; margin-bottom:3px; }
  .mail-preview{ font-size:12px; color:var(--ink-soft); line-height:1.45; margin-bottom:10px; }
  .mail-actions{ display:flex; border-top:1px solid var(--bg-deep); padding-top:9px; }
  .mail-action{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:10.5px; font-family:'Rubik',sans-serif; }
  .mail-action svg{ width:16px; height:16px; }
  .mail-action.on{ color:var(--gold); font-weight:600; }

  /* ---- suggestion sits at bottom of dashboard only ---- */

  .overlay{ position:fixed; inset:0; background:rgba(20,8,11,.5); backdrop-filter:blur(2px); display:none; align-items:flex-end; justify-content:center; z-index:100; }
  .overlay.open{ display:flex; }
  .sheet{ width:100%; max-width:460px; background:var(--bg); border-radius:24px 24px 0 0; padding:10px 20px 26px; max-height:88vh; overflow-y:auto; animation:sheetUp .22s ease; position:relative; }
  @keyframes sheetUp{ from{transform:translateY(40px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-handle{ width:38px; height:4px; background:var(--bg-deep); border-radius:2px; margin:8px auto 14px; }
  .sheet-titlerow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet h2{ font-family:'Frank Ruhl Libre',serif; color:var(--burgundy); font-size:19px; }
  .sheet .sheet-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .close-x{ background:var(--paper); border:1px solid var(--bg-deep); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=date], .field input[type=time]{
    width:100%; border:1px solid var(--bg-deep); background:var(--paper); border-radius:12px; padding:11px 13px;
    font-family:'Rubik',sans-serif; font-size:13.5px; color:var(--ink); outline:none;
  }
  .field input:focus{ border-color:var(--gold); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .color-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .color-dot{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:3px solid transparent; }
  .color-dot.selected{ border-color:var(--ink); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions button{ flex:1; border:none; border-radius:13px; padding:12px 0; font-family:'Rubik',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-cancel{ background:var(--burgundy-soft); color:var(--burgundy); }
  .btn-save{ background:var(--burgundy); color:var(--on-burgundy); }
  .btn-delete{ background:none; color:var(--ink-soft); text-decoration:underline; width:100%; border:none; padding:12px 0; font-family:'Rubik',sans-serif; font-size:12.5px; cursor:pointer; margin-top:2px; }

  .mic-stage{ display:flex; flex-direction:column; align-items:center; padding:10px 0 8px; }
  .mic-circle{ width:84px; height:84px; border-radius:50%; background:var(--burgundy); display:flex; align-items:center; justify-content:center; margin-bottom:14px; position:relative; }
  .mic-circle svg{ width:30px; height:30px; fill:var(--on-burgundy); }
  .mic-circle::before,.mic-circle::after{ content:''; position:absolute; inset:0; border-radius:50%; border:2px solid var(--gold); opacity:0; }
  .mic-circle.recording::before{ animation:micPulse 1.6s ease-out infinite; }
  .mic-circle.recording::after{ animation:micPulse 1.6s ease-out infinite .5s; }
  @keyframes micPulse{ 0%{transform:scale(1);opacity:.7;} 100%{transform:scale(1.7);opacity:0;} }
  .mic-status{ font-size:13px; color:var(--ink-soft); margin-bottom:14px; min-height:16px; text-align:center; }
  .mic-input-row{ width:100%; display:flex; gap:8px; }
  .mic-input-row input{ flex:1; border:1px solid var(--bg-deep); background:var(--paper); border-radius:12px; padding:11px 13px; font-family:'Rubik',sans-serif; font-size:13.5px; outline:none; color:var(--ink); }
  .mic-input-row input:focus{ border-color:var(--gold); }
  .mic-go{ border:none; border-radius:12px; padding:0 18px; background:var(--gold); color:var(--paper); font-family:'Rubik',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }
  .mic-hint{ font-size:11px; color:var(--ink-soft); margin-top:10px; text-align:center; }
  .confirm-card{ width:100%; background:var(--burgundy-soft); border:1px dashed var(--burgundy); border-radius:14px; padding:14px; display:none; }
  .confirm-type{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--burgundy); font-weight:600; margin-bottom:8px; }
  .confirm-type svg{ width:14px; height:14px; }
  .confirm-title{ font-size:14.5px; font-weight:500; margin-bottom:4px; }
  .confirm-time{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .confirm-actions{ display:flex; gap:8px; }
  .confirm-actions button{ flex:1; border:none; border-radius:11px; padding:10px 0; font-family:'Rubik',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .confirm-add{ background:var(--burgundy); color:var(--on-burgundy); }
  .confirm-cancel{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--bg-deep) !important; }
  .mic-added{ display:none; width:100%; background:var(--burgundy-soft); border:1px dashed var(--burgundy); border-radius:12px; padding:10px 12px; font-size:12.5px; color:var(--burgundy); margin-top:4px; text-align:center; }

  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-top:1px solid var(--bg-deep); }
  .settings-row:first-of-type{ border-top:none; }
  .settings-label{ font-size:14px; }
  .switch{ position:relative; width:44px; height:26px; flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{ position:absolute; inset:0; background:var(--bg-deep); border-radius:14px; cursor:pointer; transition:background .2s; }
  .switch-track::before{ content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:var(--paper); border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .switch input:checked + .switch-track{ background:var(--burgundy); }
  html[dir="rtl"] .switch input:checked + .switch-track::before{ transform:translateX(-18px); }
  html[dir="ltr"] .switch input:checked + .switch-track::before{ transform:translateX(18px); }
  .lang-toggle{ display:flex; border:1px solid var(--bg-deep); border-radius:10px; overflow:hidden; flex-shrink:0; }
  .lang-toggle button{ border:none; background:var(--paper); color:var(--ink-soft); font-family:'Rubik',sans-serif; font-size:12px; padding:7px 12px; cursor:pointer; }
  .lang-toggle button.active{ background:var(--burgundy); color:var(--on-burgundy); font-weight:600; }
  .soon-badge{ font-size:10.5px; background:var(--bg-deep); color:var(--ink-soft); padding:3px 8px; border-radius:8px; flex-shrink:0; }

  @media (prefers-reduced-motion:reduce){ .dog-wrap,.menu-btn,.mic-circle::before,.mic-circle::after{ transition:none; animation:none; } }

  /* dog idle animation */
  @keyframes dogIdle{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6px) rotate(-1deg); } }
  .dog-wrap img{ animation:dogIdle 4.5s ease-in-out infinite; }
  .dog-wrap.bark img{ animation:dogBounce .4s ease; }
  @keyframes dogBounce{ 0%{transform:scale(1);} 30%{transform:scale(1.08) translateY(-10px);} 60%{transform:scale(.97) translateY(2px);} 100%{transform:scale(1);} }
  @media (prefers-reduced-motion:reduce){ .dog-wrap img{ animation:none; } }

  /* mic sheet v2 */
  .mic-avatar{ width:92px; height:92px; border-radius:50%; overflow:hidden; margin-bottom:14px; box-shadow:0 8px 20px rgba(67,10,27,.3); border:3px solid var(--paper); }
  .mic-avatar img{ width:100%; height:100%; object-fit:cover; }
  .wave-row{ display:flex; align-items:center; justify-content:center; gap:4px; height:28px; margin-bottom:14px; }
  .wave-row span{ width:4px; border-radius:2px; background:var(--gold); animation:waveBar 1s ease-in-out infinite; }
  .wave-row span:nth-child(1){ height:10px; animation-delay:0s; }
  .wave-row span:nth-child(2){ height:22px; animation-delay:.1s; }
  .wave-row span:nth-child(3){ height:14px; animation-delay:.2s; }
  .wave-row span:nth-child(4){ height:26px; animation-delay:.3s; }
  .wave-row span:nth-child(5){ height:16px; animation-delay:.4s; }
  .wave-row span:nth-child(6){ height:22px; animation-delay:.5s; }
  .wave-row span:nth-child(7){ height:12px; animation-delay:.6s; }
  @keyframes waveBar{ 0%,100%{ transform:scaleY(.5); } 50%{ transform:scaleY(1.3); } }
  .mic-input-row input{ text-align:center; border:none; background:none; font-size:15px; }
  .mic-input-row input:focus{ border:none; }
  .mic-stop-btn{ width:64px; height:64px; border-radius:50%; background:var(--burgundy); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; margin:10px auto 0; box-shadow:0 8px 20px rgba(67,10,27,.3); }
  .mic-stop-btn svg{ width:22px; height:22px; fill:var(--on-burgundy); }

  /* recurring pill rows */
  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill-opt{ border:1px solid var(--bg-deep); background:var(--paper); color:var(--ink); border-radius:12px; padding:9px 14px; font-family:'Rubik',sans-serif; font-size:12.5px; cursor:pointer; }
  .pill-opt.selected{ background:var(--burgundy); color:var(--on-burgundy); border-color:var(--burgundy); }
  #monthDaySelect{ width:100%; border:1px solid var(--bg-deep); background:var(--paper); border-radius:12px; padding:10px 12px; font-family:'Rubik',sans-serif; font-size:13.5px; color:var(--ink); }

  /* toast */
  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:12px; font-size:12.5px; box-shadow:0 8px 20px rgba(0,0,0,.25); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* tasks page */
  .tasks-head-row{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
  .new-task-wrap{ position:relative; }
  .new-task-btn{ background:var(--burgundy); color:var(--on-burgundy); border:none; border-radius:14px; padding:10px 16px; font-family:'Rubik',sans-serif; font-weight:600; font-size:12.5px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .new-task-btn svg{ width:15px; height:15px; }
  .new-task-menu{ display:none; position:absolute; top:calc(100% + 8px); right:0; background:var(--paper); border:1px solid var(--bg-deep); border-radius:14px; box-shadow:0 8px 20px rgba(67,10,27,.15); overflow:hidden; z-index:20; min-width:170px; }
  html[dir="ltr"] .new-task-menu{ right:auto; left:0; }
  .new-task-menu.open{ display:block; }
  .new-task-menu button{ width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; border:none; background:none; cursor:pointer; font-family:'Rubik',sans-serif; font-size:13px; color:var(--ink); text-align:start; }
  .new-task-menu button:hover{ background:var(--burgundy-soft); }
  .new-task-menu button svg{ width:16px; height:16px; color:var(--burgundy); flex-shrink:0; }
  .tasks-head-title{ text-align:end; }
  .tasksPageTitle{ font-family:'Frank Ruhl Libre',serif; font-size:18px; }
  .tasksPageSub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .task-row-card{ display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--bg-deep); border-radius:15px; padding:13px 14px; margin-bottom:9px; box-shadow:0 3px 10px rgba(67,10,27,.05); }

  /* mail important sticker */
  .mail-card{ position:relative; }
  .important-sticker{ position:absolute; top:-8px; inset-inline-end:14px; background:var(--gold); color:var(--paper); font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:8px; transform:rotate(4deg); box-shadow:0 3px 8px rgba(0,0,0,.15); }
</style>
</head>

          <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></div>
          <span id="menuCalLabel"></span>
        </button>
        <button class="menu-btn" id="btn-tasks" onclick="goTasks()">
          <span class="badge" id="taskBadge">0</span>
          <div class="menu-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></div>
          <span id="menuTasksLabel"></span>
        </button>
      </div>

      <div class="suggest-card" id="suggestCard" onclick="suggestTap()">
        <div class="suggest-icon"><svg id="suggestIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></div>
        <div class="suggest-body">
          <div class="suggest-label" id="suggestLabel"></div>
          <div class="suggest-title" id="suggestTitle"></div>
          <div class="suggest-meta" id="suggestMeta"></div>
        </div>
      </div>
    </div>

    <!-- CALENDAR -->
    <div class="view" id="view-calendar">
      <div class="subhead-row">
        <button class="sq-btn" onclick="showView('dashboard')" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="calBackArrow"><path d="M9 18l6-6-6-6"></path></svg></button>
        <div class="daynav">
          <button class="daynav-arrow" onclick="shiftDay(1)" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
          <span class="daynav-pill" id="dayPill"></span>
          <button class="daynav-arrow" onclick="shiftDay(-1)" aria-label="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
        </div>
      </div>
      <div class="daylabel-row">
        <span class="daylabel" id="dayWeekday"></span>
        <span class="daycount" id="dayCount"></span>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="fab">
        <button onclick="openEventSheet(null)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span id="addEventLabel"></span>
        </button>
      </div>
    </div>

    <!-- TASKS -->
    <div class="view" id="view-tasks">
      <div class="subhead-row">
        <button class="sq-btn" onclick="showView('dashboard')" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="tasksBackArrow"><path d="M9 18l6-6-6-6"></path></svg></button>
        <span class="subhead-date" id="dateDisplayTasks"></span>
      </div>
      <div class="tasks-head-row">
        <div class="new-task-wrap">
          <button class="new-task-btn" onclick="toggleNewTaskMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
            <span id="newTaskBtnLabel"></span>
          </button>
          <div class="new-task-menu" id="newTaskMenu">
            <button onclick="startRegularTask()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg><span id="regularTaskLabel"></span></button>
            <button onclick="openRecurringSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg><span id="recurringTaskLabel"></span></button>
          </div>
        </div>

          <div class="tasksPageTitle" id="tasksPageTitle"></div>
          <div class="tasksPageSub" id="tasksPageSub"></div>
        </div>

      </div>
      <div id="taskListFull"></div>
    </div>

    <!-- MAIL -->
    <div class="view" id="view-mail">
      <div class="subhead-row">
        <button class="sq-btn" onclick="showView('dashboard')" aria-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="mailBackArrow"><path d="M9 18l6-6-6-6"></path></svg></button>
        <span class="subhead-date" id="dateDisplayMail"></span>

      </div>
      <div id="mailListFull"></div>
    </div>

  </div>
</div>

<!-- Event sheet -->
<div class="overlay" id="eventOverlay" onclick="closeOnBg(event,'eventOverlay')">
  <div class="sheet">
    <div class="sheet-titlerow">
      <h2 id="eventSheetTitle"></h2>
      <button class="close-x" onclick="closeSheet('eventOverlay')">✕</button>
    </div>
    <div class="field">
      <label id="lblEventName"></label>
      <input type="text" id="eventName">
    </div>
    <div class="field">
      <label id="lblEventDate"></label>
      <input type="date" id="eventDate">
    </div>
    <div class="field-row">
      <div class="field"><label id="lblEventStart"></label><input type="time" id="eventStart"></div>
      <div class="field"><label id="lblEventEnd"></label><input type="time" id="eventEnd"></div>
    </div>
    <div class="field">
      <label id="lblEventColor"></label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="eventCancelBtn" onclick="closeSheet('eventOverlay')"></button>
      <button class="btn-save" id="eventSaveBtn" onclick="saveEvent()"></button>
    </div>
    <button class="btn-delete" id="eventDeleteBtn" style="display:none" onclick="deleteEventFromSheet()"></button>
  </div>
</div>

<!-- Recurring task sheet -->
<div class="overlay" id="recurringOverlay" onclick="closeOnBg(event,'recurringOverlay')">
  <div class="sheet">
    <div class="sheet-titlerow"><h2 id="recurringSheetTitle"></h2><button class="close-x" onclick="closeSheet('recurringOverlay')">✕</button></div>
    <div class="field">
      <label id="lblRecurringName"></label>
      <input type="text" id="recurringName">
    </div>
    <div class="field">
      <label id="lblFrequency"></label>
      <div class="pill-row" id="freqRow">
        <button class="pill-opt" data-freq="monthly" onclick="pickFreq('monthly')"></button>
        <button class="pill-opt" data-freq="weekly" onclick="pickFreq('weekly')"></button>
        <button class="pill-opt" data-freq="daily" onclick="pickFreq('daily')"></button>
      </div>
    </div>
    <div class="field" id="weeklyDaysField">
      <label id="lblWeekDays"></label>
      <div class="pill-row" id="weekDaysRow"></div>
    </div>
    <div class="field" id="monthlyDayField" style="display:none">
      <label id="lblMonthDay"></label>
      <select id="monthDaySelect"></select>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="recurringCancelBtn" onclick="closeSheet('recurringOverlay')"></button>
      <button class="btn-save" id="recurringSaveBtn" onclick="saveRecurringTask()"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

/* ================= date helpers ================= */
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
function nowHM(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
var viewedDate = todayStr();
function shiftDay(delta){
  var d = new Date(viewedDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  viewedDate = fmtDate(d);
  renderCalendarView();
}

var TASKS_KEY='amigo_tasks_v1'; var tasks=[];
function loadTasks(){ try{ var raw=localStorage.getItem(TASKS_KEY); tasks = raw?JSON.parse(raw):seedTasks(); }catch(e){ tasks=seedTasks(); } }
function seedTasks(){ return t().defaultTasks.map(function(d,i){ return {id:i+1, text:d.text, done:!!d.done, recurring:!!d.recurring}; }); }
function saveTasks(){ try{ localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); }catch(e){} }
function addTask(text, recurring){ tasks.unshift({id:Date.now(), text:text, done:false, recurring:!!recurring}); saveTasks(); renderTasksFull(); renderSuggestion(); }
function toggleTask(id){ var it=tasks.find(function(x){return x.id===id;}); if(it){ it.done=!it.done; saveTasks(); renderTasksFull(); renderSuggestion(); } }
function deleteTask(id){ tasks=tasks.filter(function(x){return x.id!==id;}); saveTasks(); renderTasksFull(); renderSuggestion(); }

function goTasks(){ showView('tasks'); closeNewTaskMenu(); renderTasksFull(); }

/* ---- recurring task sheet ---- */
var recurFreq = 'weekly';
var recurDays = new Set([0]);
function buildWeekDaysRow(){
  var s=t();
  var row = document.getElementById('weekDaysRow');
  row.innerHTML = s.weekDaysShort.map(function(lbl,i){
    return '<button class="pill-opt'+(recurDays.has(i)?' selected':'')+'" onclick="toggleWeekDay('+i+')">'+lbl+'</button>';
  }).join('');
}
function toggleWeekDay(i){
  if(recurDays.has(i)) recurDays.delete(i); else recurDays.add(i);
  buildWeekDaysRow();
}
function buildMonthDaySelect(){
  var sel = document.getElementById('monthDaySelect');
  if(sel.options.length) return;
  for(var d=1; d<=31; d++){ var opt=document.createElement('option'); opt.value=d; opt.textContent=d; sel.appendChild(opt); }
}
function pickFreq(freq){
  recurFreq = freq;
  document.querySelectorAll('.pill-opt[data-freq]').forEach(function(b){ b.classList.toggle('selected', b.getAttribute('data-freq')===freq); });
  document.getElementById('weeklyDaysField').style.display = freq==='weekly' ? 'block' : 'none';
  document.getElementById('monthlyDayField').style.display = freq==='monthly' ? 'block' : 'none';
}
function openRecurringSheet(){
  closeNewTaskMenu();
  document.getElementById('recurringName').value='';
  recurFreq='weekly'; recurDays=new Set([0]);
  pickFreq('weekly');
  buildWeekDaysRow();
  buildMonthDaySelect();
  openSheet('recurringOverlay');
}
function saveRecurringTask(){
  var name = document.getElementById('recurringName').value.trim();
  if(!name) return;
  var meta = { freq:recurFreq };
  if(recurFreq==='weekly') meta.days = Array.from(recurDays);
  if(recurFreq==='monthly') meta.dayOfMonth = parseInt(document.getElementById('monthDaySelect').value,10);
  tasks.unshift({ id:Date.now(), text:name, done:false, recurring:true, recur:meta });
  saveTasks();
  closeSheet('recurringOverlay');
  renderTasksFull();
  renderSuggestion();
}

var EVENTS_KEY='amigo_events_v1'; var events=[];
function loadEvents(){ try{ var raw=localStorage.getItem(EVENTS_KEY); events = raw?JSON.parse(raw):seedEvents(); }catch(e){ events=seedEvents(); } }
function seedEvents(){ var today=todayStr(); return t().defaultEvents.map(function(d,i){ return {id:i+1, date:today, title:d.title, start:d.time, end:d.endTime, color:COLORS[d.color % COLORS.length]}; }); }
function saveEvents(){ try{ localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); }catch(e){} }
function eventsForDate(dateStr){ return events.filter(function(e){return e.date===dateStr;}).sort(function(a,b){return (a.start||'').localeCompare(b.start||'');}); }

function renderCalendarView(){
  var s=t();
  var d = new Date(viewedDate+'T00:00:00');
  document.getElementById('dayPill').textContent = lang==='he' ? (d.getDate()+' ב'+s.hebMonths[d.getMonth()]) : (s.hebMonths[d.getMonth()]+' '+d.getDate());
  document.getElementById('dayWeekday').textContent = s.hebDays[d.getDay()];
  var list = eventsForDate(viewedDate);
  document.getElementById('dayCount').textContent = s.dayCount(list.length);
  var isToday = viewedDate === todayStr();
  var now = nowHM();
  var tl = document.getElementById('timeline');
  if(list.length===0){
    tl.innerHTML = '<div class="empty-note">'+s.emptyTasks.replace(s.addPlaceholder,'')+'</div>';
    tl.innerHTML = '<div class="empty-note">🗓️</div>';
  } else {
    tl.innerHTML = list.map(function(ev,idx){
      var past = isToday && ev.end && ev.end <= now;
      return '<div class="timeline-item">'+
        '<div class="tl-dot-col"><div class="tl-dot" style="background:'+ev.color+'"></div>'+(idx<list.length-1?'<div class="tl-line"></div>':'')+'</div>'+
        '<div class="tl-card" style="border-inline-start-color:'+ev.color+'">'+
          '<button class="tl-edit" onclick="openEventSheet('+ev.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>'+
          '<div class="tl-body"><div class="tl-title">'+escapeHtml(ev.title)+'</div><div class="tl-time">'+escapeHtml(ev.start||'')+(ev.end?'–'+escapeHtml(ev.end):'')+'</div></div>'+
          (past ? '<span class="tl-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>' : '')+
        '</div></div>';
    }).join('');
  }
  renderSuggestion();
}

var editingEventId = null;
function buildColorRow(){
  var row = document.getElementById('colorRow');

}
var selectedColor = COLORS[0];

  document.querySelectorAll('.color-dot').forEach(function(el){ el.classList.toggle('selected', el.getAttribute('data-color')===c); });
}
function openEventSheet(id){
  var s=t();
  editingEventId = id;
  document.getElementById('eventSheetTitle').textContent = id ? s.eventEditTitle : s.eventNewTitle;
  document.getElementById('eventDeleteBtn').style.display = id ? 'block' : 'none';
  if(id){
    var ev = events.find(function(x){return x.id===id;});
    document.getElementById('eventName').value = ev.title;
    document.getElementById('eventDate').value = ev.date;
    document.getElementById('eventStart').value = ev.start||'';
    document.getElementById('eventEnd').value = ev.end||'';
    selectedColor = ev.color;
  } else {
    document.getElementById('eventName').value = '';
    document.getElementById('eventDate').value = viewedDate;
    document.getElementById('eventStart').value = '';
    document.getElementById('eventEnd').value = '';
    selectedColor = COLORS[0];
  }
  buildColorRow();
  pickColor(selectedColor);
  openSheet('eventOverlay');
}
function saveEvent(){
  var title = document.getElementById('eventName').value.trim();
  if(!title) return;
  var date = document.getElementById('eventDate').value || viewedDate;
  var start = document.getElementById('eventStart').value;
  var end = document.getElementById('eventEnd').value;
  if(editingEventId){
    var ev = events.find(function(x){return x.id===editingEventId;});
    ev.title=title; ev.date=date; ev.start=start; ev.end=end; ev.color=selectedColor;
  } else {
    events.push({id:Date.now(), title:title, date:date, start:start, end:end, color:selectedColor});
  }
  saveEvents();
  closeSheet('eventOverlay');
  viewedDate = date;
  renderCalendarView();
}
function deleteEventFromSheet(){
  if(editingEventId){ events = events.filter(function(x){return x.id!==editingEventId;}); saveEvents(); }
  closeSheet('eventOverlay');
  renderCalendarView();
}

        '<button class="mail-action '+(m.important?'on':'')+'" onclick="toggleImportant('+m.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a8 8 0 0 1 16 0v1"></path></svg><span>'+s.actImportant+'</span></button>'+
        '<button class="mail-action" onclick="mailToTask('+m.id+',\''+escapeAttr(m.subject)+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><span>'+s.actTask+'</span></button>'+
        '<button class="mail-action" onclick="hideMail('+m.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"></path></svg><span>'+s.actHide+'</span></button>'+
      '</div></div>';
  }).join('');
}

/* ================= smart suggestion ================= */
function suggestTap(){
  var kind = document.getElementById('suggestCard').getAttribute('data-kind');
  if(kind==='event') goCalendar();
  else if(kind==='mail') goMail();
  else if(kind==='task') goTasks();
}
function renderSuggestion(){
  var s=t();
  var card = document.getElementById('suggestCard');
  var icon = document.getElementById('suggestIcon');
  var today = todayStr(); var now = nowHM();
  var upcoming = events.filter(function(e){ return e.date>today || (e.date===today && e.start>=now); })
    .sort(function(a,b){ return (a.date+a.start).localeCompare(b.date+b.start); });
  if(upcoming.length){
    var ev = upcoming[0];
    card.setAttribute('data-kind','event');
    icon.innerHTML = '<rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path>';
    document.getElementById('suggestLabel').textContent = s.suggestEventLabel;
    document.getElementById('suggestTitle').textContent = ev.title;
    document.getElementById('suggestMeta').textContent = (ev.date===today ? '' : ev.date+' · ') + (ev.start||'');
    return;
  }
  var mails = getMailList();
  var impMail = mails.find(function(m){return m.important;}) || mails[0];
  if(impMail){
    card.setAttribute('data-kind','mail');
    icon.innerHTML = '<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path>';
    document.getElementById('suggestLabel').textContent = s.suggestMailLabel;
    document.getElementById('suggestTitle').textContent = impMail.subject;
    document.getElementById('suggestMeta').textContent = impMail.from;
    return;
  }
  var openTasks = tasks.filter(function(x){return !x.done;});
  if(openTasks.length){
    card.setAttribute('data-kind','task');
    icon.innerHTML = '<path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>';
    document.getElementById('suggestLabel').textContent = s.suggestTaskLabel;
    document.getElementById('suggestTitle').textContent = openTasks[0].text;
    document.getElementById('suggestMeta').textContent = '';
    return;
  }
  card.setAttribute('data-kind','');
  icon.innerHTML = '<path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2z"></path>';
  document.getElementById('suggestLabel').textContent = '';
  document.getElementById('suggestTitle').textContent = s.suggestNone;
  document.getElementById('suggestMeta').textContent = s.suggestNoneMeta;
}

/* ================= bark sound ================= */
var audioCtx=null;
function playBark(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    var run = function(){
      var now = audioCtx.currentTime;
      function bark(t0,dur){
        var osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), filter=audioCtx.createBiquadFilter();
        filter.type='lowpass'; filter.frequency.setValueAtTime(1400,t0);
        osc.type='sawtooth'; osc.frequency.setValueAtTime(300,t0); osc.frequency.exponentialRampToValueAtTime(85,t0+dur);
        gain.gain.setValueAtTime(0.0001,t0); gain.gain.exponentialRampToValueAtTime(0.55,t0+0.02); gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0+dur+0.03);
      }
      bark(now,0.14); bark(now+0.17,0.17);
    };
    if(audioCtx.state==='suspended'){ audioCtx.resume().then(run); } else { run(); }
  }catch(e){ /* audio unavailable in this environment */ }
}

/* ================= mic ================= */
var pendingItem=null;
function dogTap(){
  playBark();
  var wrap=document.querySelector('.dog-wrap');
  wrap.classList.add('bark');
  setTimeout(function(){ wrap.classList.remove('bark'); }, 420);
  openMic();
}
var lastBarkMinute=-1;
function scheduleAutoBark(){
  setInterval(function(){
    var d=new Date();
    if(d.getSeconds()===0 && d.getMinutes()!==lastBarkMinute){
      lastBarkMinute=d.getMinutes();
      var micOpen = document.getElementById('micOverlay').classList.contains('open');
      if(!micOpen){
        playBark();
        var wrap=document.querySelector('.dog-wrap');
        if(wrap){ wrap.classList.add('bark'); setTimeout(function(){ wrap.classList.remove('bark'); },420); }
      }
    }
  },1000);
}
function openMic(){
  var s=t();
  document.getElementById('micInput').value='';
  document.getElementById('micStatus').textContent=s.micListening;
  document.getElementById('waveRow').style.display='flex';
  document.getElementById('micStopBtn').style.display='flex';
  document.getElementById('micInputRow').style.display='flex';
  document.getElementById('confirmCard').style.display='none';
  document.getElementById('micAdded').style.display='none';
  openSheet('micOverlay');
  setTimeout(function(){ document.getElementById('micInput').focus(); },200);
}
function processMic(){
  var s=t();
  var val=document.getElementById('micInput').value.trim();
  if(!val) return;
  document.getElementById('micStatus').textContent=s.micThinking;
  document.getElementById('waveRow').style.display='none';
  document.getElementById('micStopBtn').style.display='none';
  setTimeout(function(){
    var result=classify(val);
    pendingItem=result;
    document.getElementById('micInputRow').style.display='none';
    document.getElementById('micStatus').textContent='';
    document.getElementById('confirmType').innerHTML=(result.type==='event'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>') +
      '<span>'+(result.type==='event'?s.detectedEvent:s.detectedTask)+'</span>';
    document.getElementById('confirmTitle').textContent=result.title;
    document.getElementById('confirmTime').textContent = result.type==='event' ? (result.time||'') : '';
    document.getElementById('confirmTime').style.display = (result.type==='event' && result.time) ? 'block':'none';
    document.getElementById('confirmCard').style.display='block';
  },1100);
}
function confirmAdd(){
  var s=t();
  if(!pendingItem) return;
  if(pendingItem.type==='event'){ events.push({id:Date.now(), title:pendingItem.title, date:todayStr(), start:pendingItem.time||'', end:'', color:COLORS[0]}); saveEvents(); renderCalendarView(); }
  else { addTask(pendingItem.title,false); }
  document.getElementById('confirmCard').style.display='none';
  document.getElementById('micAdded').textContent=s.micAdded;
  document.getElementById('micAdded').style.display='block';
  pendingItem=null;
  renderSuggestion();
  setTimeout(function(){ closeSheet('micOverlay'); },1000);
}
function confirmCancel(){
  document.getElementById('confirmCard').style.display='none';
  document.getElementById('micInputRow').style.display='flex';
  document.getElementById('waveRow').style.display='flex';
  document.getElementById('micStopBtn').style.display='flex';
  document.getElementById('micStatus').textContent=t().micListening;
  document.getElementById('micInput').value='';
  setTimeout(function(){ document.getElementById('micInput').focus(); },150);
}
function classify(raw){
  var s=t();
  var text=raw.trim();
  var isEvent=false, time='';
  s.eventWords.forEach(function(w){ if(text.toLowerCase().indexOf(w.toLowerCase())!==-1) isEvent=true; });
  var timeRegexHe=/ב-?\s*(\d{1,2})(:(\d{2}))?\s*(בבוקר|בערב|בצהריים|בלילה)?/;
  var timeRegexEn=/at\s*(\d{1,2})(:(\d{2}))?\s*(am|pm)?/i;
  var m = lang==='he' ? text.match(timeRegexHe) : text.match(timeRegexEn);
  if(m){
    isEvent=true;
    var hour=parseInt(m[1],10); var minutes=m[3]||'00'; var ampm=(m[4]||'').toLowerCase();
    if(lang==='he'){ if((ampm===s.ampmEvening || ampm===s.ampmNight) && hour<12) hour+=12; }
    else{ if(ampm==='pm' && hour<12) hour+=12; if(ampm==='am' && hour===12) hour=0; }
    time=(hour<10?'0':'')+hour+':'+minutes;
  }
  var title=text;
  if(m) title=title.replace(m[0],' ');
  s.stripWords.forEach(function(w){ title=title.replace(new RegExp(w,'gi'),' '); });
  title=title.replace(/\s{2,}/g,' ').trim();
  if(!title) title=text;
  title=title.charAt(0).toUpperCase()+title.slice(1);
  return { type: isEvent?'event':'task', title:title, time:time };
}

/* ================= overlays / utils ================= */
function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }
function closeOnBg(e,id){ if(e.target.id===id) closeSheet(id); }
function escapeHtml(str){ var d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function escapeAttr(str){ return String(str).replace(/'/g,"\\'"); }
var toastTimer=null;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
